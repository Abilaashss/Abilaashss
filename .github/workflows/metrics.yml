name: Metrics

on:
  schedule: [{cron: "30 0 * * *"}]
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/metrics.yml"]

concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Overview
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/overview.svg
          base: ""
          config_display: large
          config_timezone: Asia/Kolkata
          debug: yes
          repositories: 100
          repositories_batch: 25
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_ignored: html, css, jupyter notebook, procfile, dockerfile, makefile, shell
          plugin_notable: yes
          plugin_notable_from: organization
          plugin_notable_types: commit, pull_request
