name: Metrics

on:
  schedule: [{cron: "30 0 * * *"}]
  workflow_dispatch:
  push:
    branches: [main, readme-preview]
    paths: [".github/workflows/metrics.yml"]

concurrency:
  group: metrics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Profile (dark)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/profile-dark.svg
          base: ""
          config_display: large
          config_timezone: Asia/Kolkata
          config_order: isocalendar, languages
          repositories: 100
          repositories_batch: 10
          repositories_affiliations: owner, collaborator, organization_member
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 6
          plugin_languages_threshold: 1%
          plugin_languages_ignored: html, css, jupyter notebook, procfile, dockerfile, makefile, shell, plpgsql, mdx, mako
          extras_css: "svg{color:#8b949e!important}h2.field{color:#8b949e!important;font-size:12px!important;font-weight:600!important;letter-spacing:.08em;text-transform:uppercase;margin:14px 0 8px!important}h2.field>svg{display:none!important}h3.field{color:#e6edf3!important;font-weight:600!important;font-size:13px!important}h3.field>svg,.field svg{fill:#8b949e!important}.field{color:#8b949e}path[fill='#ebedf0']{fill:#161b22!important}path[fill='#9be9a8']{fill:#0e4429!important}path[fill='#40c463']{fill:#006d32!important}path[fill='#30a14e']{fill:#26a641!important}path[fill='#216e39']{fill:#39d353!important}rect[fill='#d1d5da'],path[fill='#d1d5da']{fill:#30363d!important}.field.language,.field.language small{color:#e6edf3!important}.repository{border:1px solid #30363d;border-radius:6px;padding:12px 14px;margin:6px!important;box-sizing:border-box;width:calc(100% - 12px)!important}.repository .name span:first-child{color:#4493f8!important;font-weight:600}.repository .name,.repository .description{width:auto!important}.repository .description,.repository .infos{color:#8b949e!important;margin-left:0!important}.repository .name>svg,.repository .name span:last-child{display:none!important}.repository .infos>div:not(:first-child){display:none!important}"

      - name: Work (dark)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/work-dark.svg
          base: ""
          config_display: large
          config_timezone: Asia/Kolkata
          plugin_repositories: yes
          plugin_repositories_featured: FinSense, AWS-Hack_AI-For-Bharat, RAG-X, PaperPulse, GradeA-gent, Life-Coach
          plugin_repositories_order: featured
          extras_css: "svg{color:#8b949e!important}h2.field{color:#8b949e!important;font-size:12px!important;font-weight:600!important;letter-spacing:.08em;text-transform:uppercase;margin:14px 0 8px!important}h2.field>svg{display:none!important}h3.field{color:#e6edf3!important;font-weight:600!important;font-size:13px!important}h3.field>svg,.field svg{fill:#8b949e!important}.field{color:#8b949e}path[fill='#ebedf0']{fill:#161b22!important}path[fill='#9be9a8']{fill:#0e4429!important}path[fill='#40c463']{fill:#006d32!important}path[fill='#30a14e']{fill:#26a641!important}path[fill='#216e39']{fill:#39d353!important}rect[fill='#d1d5da'],path[fill='#d1d5da']{fill:#30363d!important}.field.language,.field.language small{color:#e6edf3!important}.repository{border:1px solid #30363d;border-radius:6px;padding:12px 14px;margin:6px!important;box-sizing:border-box;width:calc(100% - 12px)!important}.repository .name span:first-child{color:#4493f8!important;font-weight:600}.repository .name,.repository .description{width:auto!important}.repository .description,.repository .infos{color:#8b949e!important;margin-left:0!important}.repository .name>svg,.repository .name span:last-child{display:none!important}.repository .infos>div:not(:first-child){display:none!important}"

      - name: Profile (light)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/profile-light.svg
          base: ""
          config_display: large
          config_timezone: Asia/Kolkata
          config_order: isocalendar, languages
          repositories: 100
          repositories_batch: 10
          repositories_affiliations: owner, collaborator, organization_member
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 6
          plugin_languages_threshold: 1%
          plugin_languages_ignored: html, css, jupyter notebook, procfile, dockerfile, makefile, shell, plpgsql, mdx, mako
          extras_css: "svg{color:#59636e!important}h2.field{color:#59636e!important;font-size:12px!important;font-weight:600!important;letter-spacing:.08em;text-transform:uppercase;margin:14px 0 8px!important}h2.field>svg{display:none!important}h3.field{color:#1f2328!important;font-weight:600!important;font-size:13px!important}h3.field>svg,.field svg{fill:#59636e!important}.field{color:#59636e}path[fill='#ebedf0']{fill:#ebedf0!important}path[fill='#9be9a8']{fill:#9be9a8!important}path[fill='#40c463']{fill:#40c463!important}path[fill='#30a14e']{fill:#30a14e!important}path[fill='#216e39']{fill:#216e39!important}rect[fill='#d1d5da'],path[fill='#d1d5da']{fill:#d1d9e0!important}.field.language,.field.language small{color:#1f2328!important}.repository{border:1px solid #d1d9e0;border-radius:6px;padding:12px 14px;margin:6px!important;box-sizing:border-box;width:calc(100% - 12px)!important}.repository .name span:first-child{color:#0969da!important;font-weight:600}.repository .name,.repository .description{width:auto!important}.repository .description,.repository .infos{color:#59636e!important;margin-left:0!important}.repository .name>svg,.repository .name span:last-child{display:none!important}.repository .infos>div:not(:first-child){display:none!important}"

      - name: Work (light)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/work-light.svg
          base: ""
          config_display: large
          config_timezone: Asia/Kolkata
          plugin_repositories: yes
          plugin_repositories_featured: FinSense, AWS-Hack_AI-For-Bharat, RAG-X, PaperPulse, GradeA-gent, Life-Coach
          plugin_repositories_order: featured
          extras_css: "svg{color:#59636e!important}h2.field{color:#59636e!important;font-size:12px!important;font-weight:600!important;letter-spacing:.08em;text-transform:uppercase;margin:14px 0 8px!important}h2.field>svg{display:none!important}h3.field{color:#1f2328!important;font-weight:600!important;font-size:13px!important}h3.field>svg,.field svg{fill:#59636e!important}.field{color:#59636e}path[fill='#ebedf0']{fill:#ebedf0!important}path[fill='#9be9a8']{fill:#9be9a8!important}path[fill='#40c463']{fill:#40c463!important}path[fill='#30a14e']{fill:#30a14e!important}path[fill='#216e39']{fill:#216e39!important}rect[fill='#d1d5da'],path[fill='#d1d5da']{fill:#d1d9e0!important}.field.language,.field.language small{color:#1f2328!important}.repository{border:1px solid #d1d9e0;border-radius:6px;padding:12px 14px;margin:6px!important;box-sizing:border-box;width:calc(100% - 12px)!important}.repository .name span:first-child{color:#0969da!important;font-weight:600}.repository .name,.repository .description{width:auto!important}.repository .description,.repository .infos{color:#59636e!important;margin-left:0!important}.repository .name>svg,.repository .name span:last-child{display:none!important}.repository .infos>div:not(:first-child){display:none!important}"
