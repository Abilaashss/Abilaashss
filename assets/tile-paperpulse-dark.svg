<svg xmlns="http://www.w3.org/2000/svg" width="400" height="220" viewBox="0 0 400 220" role="img" aria-label="PaperPulse: A research copilot that finds trends and gaps across thousands of papers.">
<defs><linearGradient id="tg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset=".55" stop-color="#22d3ee"/><stop offset="1" stop-color="#b6f36a"/></linearGradient><clipPath id="f"><rect x=".5" y=".5" width="399" height="219" rx="16"/></clipPath></defs>
<style>.s{font-family:ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}@media (prefers-reduced-motion:reduce){*{animation:none!important}}
 .i{font-size:13px;fill:#4b5266;letter-spacing:.1em}
 .ti{font-size:26px;font-weight:750;letter-spacing:-.02em;fill:#f2f4f8}
 .d{font-size:15px;fill:#8b93a7}
 .tag{font-size:11px;letter-spacing:.14em;fill:#8b93a7}
 .ar{font-size:20px;fill:#4b5266}
 .sweep{fill:none;stroke:url(#tg);stroke-width:1.5;stroke-dasharray:110 1300;animation:sw 8s linear infinite;animation-delay:-3.3s}
 @keyframes sw{from{stroke-dashoffset:1410}to{stroke-dashoffset:0}}
 .orb{animation:fl 9s ease-in-out infinite;animation-delay:-3.3s}
 @keyframes fl{0%,100%{transform:translate(0,0)}50%{transform:translate(-26px,14px)}}
</style>
<g clip-path="url(#f)"><rect width="400" height="220" fill="#0d0f15"/>
<circle class="orb" cx="360" cy="30" r="70" fill="url(#tg)" opacity="0.1"/></g>
<rect x=".5" y=".5" width="399" height="219" rx="16" fill="none" stroke="#1c2030"/>
<rect x=".5" y=".5" width="399" height="219" rx="16" class="sweep"/>
<text x="28" y="44" class="m i">04</text>
<text x="372" y="46" text-anchor="end" class="s ar">↗</text>
<text x="28" y="92" class="s ti">PaperPulse</text>
<text x="28" y="128" class="s d">A research copilot that finds trends</text><text x="28" y="150" class="s d">and gaps across thousands of papers.</text>
<rect x="28" y="176" width="108" height="24" rx="12" fill="none" stroke="#1c2030"/>
<text x="40" y="192" class="m tag">RESEARCH AI</text>
</svg>