<svg xmlns="http://www.w3.org/2000/svg" width="400" height="220" viewBox="0 0 400 220" role="img" aria-label="AI for Bharat: Multi-agent studio that rewrites one idea for every audience.">
<defs><linearGradient id="tg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset=".55" stop-color="#0891b2"/><stop offset="1" stop-color="#4d7c0f"/></linearGradient><clipPath id="f"><rect x=".5" y=".5" width="399" height="219" rx="16"/></clipPath></defs>
<style>.s{font-family:ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif}.m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}@media (prefers-reduced-motion:reduce){*{animation:none!important}}
 .i{font-size:13px;fill:#9aa1b2;letter-spacing:.1em}
 .ti{font-size:26px;font-weight:750;letter-spacing:-.02em;fill:#0b0d14}
 .d{font-size:15px;fill:#5b6377}
 .tag{font-size:11px;letter-spacing:.14em;fill:#5b6377}
 .ar{font-size:20px;fill:#9aa1b2}
 .sweep{fill:none;stroke:url(#tg);stroke-width:1.5;stroke-dasharray:110 1300;animation:sw 8s linear infinite;animation-delay:-1.1s}
 @keyframes sw{from{stroke-dashoffset:1410}to{stroke-dashoffset:0}}
 .orb{animation:fl 9s ease-in-out infinite;animation-delay:-1.1s}
 @keyframes fl{0%,100%{transform:translate(0,0)}50%{transform:translate(-26px,14px)}}
</style>
<g clip-path="url(#f)"><rect width="400" height="220" fill="#ffffff"/>
<circle class="orb" cx="360" cy="30" r="70" fill="url(#tg)" opacity="0.07"/></g>
<rect x=".5" y=".5" width="399" height="219" rx="16" fill="none" stroke="#e3e6ee"/>
<rect x=".5" y=".5" width="399" height="219" rx="16" class="sweep"/>
<text x="28" y="44" class="m i">02</text>
<text x="372" y="46" text-anchor="end" class="s ar">↗</text>
<text x="28" y="92" class="s ti">AI for Bharat</text>
<text x="28" y="128" class="s d">Multi-agent studio that rewrites one</text><text x="28" y="150" class="s d">idea for every audience.</text>
<rect x="28" y="176" width="153" height="24" rx="12" fill="none" stroke="#e3e6ee"/>
<text x="40" y="192" class="m tag">AWS AI FOR BHARAT</text>
</svg>