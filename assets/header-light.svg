<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Abilaash S S — AI engineer building agents, realtime voice and the platform under them">
<defs>
  <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#eef1f4" stroke-width="1"/></pattern>
  <linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset=".55" stop-color="#ffffff" stop-opacity=".2"/><stop offset="1" stop-color="#ffffff" stop-opacity="1"/></linearGradient>
  <radialGradient id="glow" cx="0.12" cy="0.2" r="0.6"><stop offset="0" stop-color="#3d7a0a" stop-opacity=".07"/><stop offset="1" stop-color="#3d7a0a" stop-opacity="0"/></radialGradient>
  <clipPath id="c"><rect x="0.5" y="0.5" width="1199" height="339" rx="14"/></clipPath>
</defs>
<style>
  .s{font-family:ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif} .m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
  .eyebrow{font-size:13px;letter-spacing:.14em;fill:#59636e}
  .name{font-size:64px;font-weight:700;letter-spacing:-.035em;fill:#1f2328}
  .tag{font-size:21px;fill:#59636e} .tag tspan.hi{fill:#1f2328;font-weight:600}
  .meta{font-size:13px;fill:#8c959f}
  .k{font-size:14px;fill:#59636e} .v{font-size:14px;font-weight:700;fill:#3d7a0a} .n{font-size:13px;fill:#8c959f}
  .p{font-size:14px;fill:#1f2328} .pr{fill:#0f766e}
  
  .cur{animation:blink 1.1s steps(1) infinite}
  .dot{animation:pulse 2.4s ease-in-out infinite}
  @keyframes blink{50%{opacity:0}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  @media (prefers-reduced-motion:reduce){.cur,.dot{animation:none}}
</style>
<g clip-path="url(#c)">
  <rect width="1200" height="340" fill="#ffffff"/>
  <rect width="1200" height="340" fill="url(#g)"/>
  <rect width="1200" height="340" fill="url(#glow)"/>
</g>
<rect x="0.5" y="0.5" width="1199" height="339" rx="14" fill="none" stroke="#d0d7de"/>

<circle class="dot" cx="64" cy="66" r="4" fill="#3d7a0a"/>
<text x="78" y="71" class="m eyebrow">SHIPPING · CHENNAI, IN</text>
<text x="58" y="150" class="s name">Abilaash S S</text>
<text x="60" y="196" class="s tag">I build <tspan class="hi">AI products end to end</tspan> —</text>
<text x="60" y="226" class="s tag">agents, realtime voice, and the platform under them.</text>
<text x="60" y="282" class="m meta">python · typescript · go   /   langgraph · fastapi · react · postgres</text>

<rect x="712" y="44" width="440" height="252" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<circle cx="734" cy="66" r="5" fill="#d0d7de"/><circle cx="752" cy="66" r="5" fill="#d0d7de"/><circle cx="770" cy="66" r="5" fill="#d0d7de"/>
<text x="1132" y="70" text-anchor="end" class="m n">revyn · main</text>
<line x1="712" y1="86" x2="1152" y2="86" stroke="#d0d7de"/>
<text x="742" y="118" class="m p"><tspan class="pr">❯</tspan> revyn --status</text>
<g class="row"><text x="742" y="150" class="m k">services</text><text x="852" y="150" class="m v">4</text><text x="912" y="150" class="m n">python · typescript · go</text></g>
<g class="row"><text x="742" y="180" class="m k">domains</text><text x="852" y="180" class="m v">55</text><text x="912" y="180" class="m n">bounded modules, one API</text></g>
<g class="row"><text x="742" y="210" class="m k">migrations</text><text x="852" y="210" class="m v">114</text><text x="912" y="210" class="m n">alembic schema history</text></g>
<g class="row"><text x="742" y="240" class="m k">tests</text><text x="852" y="240" class="m v">240+</text><text x="912" y="240" class="m n">pytest files on the api</text></g>
<g class="row"><text x="742" y="270" class="m k">commits</text><text x="852" y="270" class="m v">800+</text><text x="912" y="270" class="m n">authored since apr '26</text></g>
<text x="742" y="304" class="m p"><tspan class="pr">❯</tspan> <tspan class="cur" fill="#3d7a0a">▍</tspan></text>
</svg>
